<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cartaz de Evento</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      background: #f0f0f0;
      font-family: Arial, sans-serif;
    }

    .cartaz {
      background: white;
      text-align: center;
      border-radius: 8px;
      margin: 30px;
      padding:20px;
      width: 400px;
      margin: auto;
      border: 10px solid green;

    }

    .cartaz h1 {
      margin-top: 0;
      padding:20px;
    }

    .cartaz button {
      background: #e67e22;
      color: white;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="cartaz">
    <h1>Show da Banda RockStars</h1>
    <p>Dia 15 de Setembro às 20h<br>No Teatro Central</p>
    <button>Comprar Ingressos</button>
  </div>
</body>
</html>
